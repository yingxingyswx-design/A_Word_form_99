plugins { id 'com.android.application' }
android { namespace 'com.example.yiyan'; compileSdk 34
    defaultConfig { applicationId 'com.example.yiyan'; minSdk 24; targetSdk 35; versionCode 28; versionName '3.12' }
    buildFeatures { viewBinding true; buildConfig true }
    dependencies {
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'dev.rikka.shizuku:api:13.1.5'
        implementation 'dev.rikka.shizuku:aidl:13.1.5'
        implementation 'dev.rikka.shizuku:provider:13.1.5'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
